<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>CampusShare</title>

<style>
:root{--p:#4F46E5;--s:#10B981;--bg:#F8FAFC;--sf:#fff;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#0B1120;--sf:#162033;--tx:#F1F5F9;--mu:#94A3B8;--bd:#273449;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,"Be Vietnam Pro",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font-weight:800;color:var(--p);font-size:18px;cursor:pointer}.logo b{color:var(--s)}

.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}.btn.g{background:var(--s)}.btn.o{background:none;color:var(--p);border:1px solid var(--p)}.btn.r{background:#EF4444}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{flex:1;min-width:130px;margin:0}

.Available,.Completed{background:#D1FAE5;color:#065F46}.Pending,.Return{background:#FEF3C7;color:#92400E}.Borrowed,.Active,.Approved{background:#DBEAFE;color:#1E40AF}.Rejected{background:#FEE2E2;color:#991B1B}
.im{width:100%;height:140px;object-fit:cover;border-radius:10px;background:var(--bg);cursor:pointer;margin-bottom:8px}.im.big{height:240px}.th{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none;min-width:0}#prev{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}#prev img{width:70px;height:70px;object-fit:cover;border-radius:8px}

.pg{animation:up .4s ease}.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
.grid>.card{transition:transform .2s,box-shadow .2s}.grid>.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}.fi{animation:fl 4s ease-in-out infinite}.modal{animation:pop .2s}.modal .card{animation:pop .25s}.btn{transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.hero h1{background:linear-gradient(90deg,#4F46E5,#10B981,#4F46E5);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gr 6s linear infinite}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
:root:root,:root[data-theme=dark]{--p:#F59E0B;--s:#FB923C;--bg:#0A0A0A;--sf:#161616;--tx:#F5F5F4;--mu:#A8A29E;--bd:#2A2A2A;color-scheme:dark}
:root[data-theme=light]{--p:#D97706;--s:#EA580C;--bg:#FFFBF5;--sf:#FFFFFF;--tx:#1C1917;--mu:#78716C;--bd:#F1E4D3;color-scheme:light}
.tag{background:#F59E0B26;color:var(--p)}.btn{color:#111}.btn.r{color:#fff}nav button.on{color:#111}.demo{background:#F59E0B22;color:var(--p)}.hero h1{background-image:linear-gradient(90deg,#F59E0B,#FB923C,#FDE68A,#F59E0B)}header,.card,details{transition:background .3s,border-color .3s}
:root:root,:root[data-theme=dark]{--p:#F27A45;--s:#F5A524;--bg:#0E0E0E;--sf:#181818;--bd:#303030}:root[data-theme=light]{--p:#E2602A;--s:#D98B06}
main{max-width:1240px}h1,h2,h3{text-transform:uppercase;font-weight:800;letter-spacing:-.01em}nav button,.btn{text-transform:uppercase;font-weight:700;font-size:13px}.card{border-radius:20px}
.mh{text-align:center;padding:10px 0 24px}.mh h1{font-size:clamp(34px,7vw,64px);margin:0;line-height:1}.mh h1 span{color:var(--p)}.mh p{font-weight:700;text-transform:uppercase;margin:12px 0 0;font-size:clamp(12px,2vw,17px)}
.mk{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}@media(max-width:820px){.mk{grid-template-columns:1fr}}
.fb{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:none;color:var(--tx);font:inherit;font-weight:700;text-transform:uppercase;cursor:pointer;transition:.2s}.fb:hover{border-color:var(--p)}.fb.on{background:var(--tx);color:var(--bg)}
.promo{margin-top:16px;background:var(--p);color:#111;border-radius:20px;padding:20px}.promo h3{margin:0 0 8px}.promo p{font-weight:600;margin:0 0 14px}.btn.dk{background:#111;color:#fff;width:100%}
.sb{display:flex;gap:12px;margin-bottom:20px}.se{flex:1;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:0 16px}.se input{border:0;background:none;margin:0;padding:16px 0;font-weight:700;text-transform:uppercase;outline:0}
.vt{display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:6px}.vt button{border:0;background:none;color:var(--tx);border-radius:10px;width:44px;cursor:pointer;font-size:18px}.vt .on{background:var(--tx);color:var(--bg)}
.gc{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.pc{padding:0;overflow:hidden}.ph{position:relative;overflow:hidden}.pc .im{height:220px;border-radius:0;margin:0;display:block;transition:transform .4s}.pc:hover .im{transform:scale(1.04)}
.bd{position:absolute;top:12px;right:12px;background:#111c;color:#fff;border:1px solid #fff3;border-radius:10px;padding:5px 12px;font-size:12px;font-weight:800;text-transform:uppercase}.hb{position:absolute;top:12px;left:12px;border:0;background:#111c;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.pb{padding:18px}.cat{color:var(--p);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.pb h3{margin:4px 0 0;font-size:20px;line-height:1.15}.pr{font-size:20px}.by{font-size:13px;font-weight:700;text-transform:uppercase;margin:10px 0 14px}
.acts{display:flex;gap:8px}.btn.w{background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 22px}.btn.w:disabled{opacity:.4;cursor:not-allowed}.ib{width:46px;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:14px;cursor:pointer;font-size:18px}
.gl{grid-template-columns:1fr!important}.gl>.pc{display:flex}.gl .ph{width:260px;flex:none}.gl .pc .im{height:100%;min-height:170px}@media(max-width:560px){.gl>.pc{display:block}.gl .ph{width:auto}}
:root:root[data-theme=dark]{--p:#F27A45;--s:#F5A524;--bg:#0E0E0E;--sf:#181818;--tx:#F5F5F4;--mu:#A8A29E;--bd:#303030;color-scheme:dark}
:root:root[data-theme=light]{--p:#E2602A;--s:#D98B06;--bg:#FFFBF5;--sf:#FFFFFF;--tx:#1C1917;--mu:#78716C;--bd:#EADBC8;color-scheme:light}
body{transition:background .3s,color .3s}
body.auth header{display:none}body.auth main{max-width:none;padding:0}.au{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}.abg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(5px) brightness(.55)}
.acard{position:relative;max-width:420px;width:100%;background:#141414cc;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff26;border-radius:24px;padding:32px;color:#F5F5F4;animation:pop .35s}.acard .mu{color:#C9C2B8}.acard input{background:#ffffff14;color:#fff;border:1px solid #ffffff30}.acard input::placeholder{color:#ffffff80}.al{color:#F5A524;cursor:pointer;font-weight:700}.acard .btn{width:100%}.ok{display:none;background:#F5A52422;border:1px solid #F5A52466;border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
#auth{display:flex;gap:8px;align-items:center}.avi{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#111;font-weight:800;flex:none;vertical-align:middle}.av{cursor:pointer;display:inline-flex;border-radius:50%;border:2px solid var(--p);padding:1px;transition:transform .2s}.av:hover{transform:scale(1.08)}
.cs{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}@media(max-width:760px){.cs{grid-template-columns:1fr}}.cv{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer;border:1px solid transparent}.cv:hover,.cv.on{border-color:var(--p)}
.ms{display:flex;flex-direction:column;gap:8px;height:380px;overflow:auto;padding:8px}.mr{display:flex;gap:8px;align-items:flex-end}.mr.me{justify-content:flex-end}.bb{max-width:75%;padding:9px 13px;border-radius:16px;background:var(--bg);border:1px solid var(--bd);word-break:break-word}.mr.me .bb{background:var(--p);color:#111;border:0}
.logo{display:flex;align-items:center;gap:8px}.acard .logo{justify-content:center}#auth{position:relative}.bell{position:relative;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px}@keyframes bmp{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}.nb{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#EF4444;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--sf)}.nb.bump{animation:bmp .4s}
.np{position:absolute;right:0;top:48px;width:min(350px,92vw);background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:0 12px 32px #0006;z-index:30;overflow:hidden;animation:pop .2s}.np .h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}.np .l{max-height:340px;overflow:auto}.ni{padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px;display:flex;gap:8px}.ni:hover{background:var(--bg)}.ni.un::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--p);margin-top:6px;flex:none}.np a{color:var(--p);cursor:pointer;font-size:13px;font-weight:700}
.nb2{background:#EF4444;color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:6px;display:inline-block}.cv{position:relative}.cv .nb2{position:absolute;right:10px;top:50%;transform:translateY(-50%);margin:0}
.hero{text-align:center;padding:50px 10px}.hero h1{font-size:clamp(28px,6vw,46px);margin:8px 0}.mu{color:var(--mu)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.modal .card{max-width:420px;width:100%;max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.stat{font-size:26px;font-weight:700;color:var(--p)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:99}
</style></head><body>
<header><span class="logo" id="lg" onclick="go('home')"></span><nav id="nav"></nav><button class="btn o" onclick="toggleTheme()">🌓</button><span id="auth"></span></header>
<main id="app"></main><div id="toast"></div>
<script>
const USERS={u1:{id:'u1',name:'Minh Anh',role:'student',school:'THPT Lê Quý Đôn',cls:'11A2',pts:120},u2:{id:'u2',name:'Gia Bảo',role:'student',school:'THPT Lê Quý Đôn',cls:'12A1',pts:85},a1:{id:'a1',name:'Cô Hạnh (School Admin)',role:'admin',school:'THPT Lê Quý Đôn'},s1:{id:'s1',name:'Super Admin',role:'super'}};
const CATS=['Sách giáo khoa','Sách tham khảo','Máy tính','Dụng cụ học tập','Thiết bị điện tử','Đồ dùng thí nghiệm','Khác'];
let items=[['Casio fx-580VN X','Máy tính',1],['Toán 11 – Đại số','Sách giáo khoa',2],['Bộ compa kỹ thuật','Dụng cụ học tập',2],['Sách Vật lý nâng cao','Sách tham khảo',1],['Kính hiển vi mini','Đồ dùng thí nghiệm',2],['Tai nghe học tiếng Anh','Thiết bị điện tử',1]].map((a,i)=>({id:'i'+i,name:a[0],cat:a[1],owner:'u'+a[2],cond:i%2?'Tốt':'Như mới',status:'Available',desc:'Còn dùng tốt, cho mượn miễn phí tại thư viện trường.',loc:'Thư viện',views:10-i,t:Date.now()-i*864e5,fav:false,imgs:[],emo:['🧮','📘','📐','📗','🔬','🎧'][i]}));
const reports=[],reviews=[],needs=[];let pimgs=[],editId=null;
function save(){try{localStorage.setItem('cs_items',JSON.stringify(items))}catch(e){toast('Bộ nhớ trình duyệt đầy, bài đăng có thể không được lưu')}}
try{const s=JSON.parse(localStorage.getItem('cs_items')||'null');if(s){items=s;items.forEach(i=>i.status='Available')}}catch(e){}
function pic(i){if(i.imgs&&i.imgs[0])return i.imgs[0];const k=CATS.indexOf(i.cat),c=['#FDE68A','#FED7AA','#FEF3C7','#FFE4C4','#FCD9A8','#FDE0C8','#EADFCB'][k<0?6:k],e=i.emo||['📘','📚','🧮','✏️','🎧','🔬','📦'][k<0?6:k];return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160"><rect width="300" height="160" fill="${c}"/><text x="150" y="105" font-size="76" text-anchor="middle">${e}</text></svg>`)}
let reqs=[],notes=[{id:1,to:'u1',txt:'Chào mừng bạn đến CampusShare!',read:false}],cur=null,page='home',f={q:'',cat:'',st:'',sort:'new'},nid=2;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function toggleTheme(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'}
function login(id){cur=USERS[id];toast('Xin chào, '+cur.name);go(cur.role=='student'?'dash':cur.role=='admin'?'admin':'super')}
function logout(){cur=null;go('home')}
function notify(to,txt){notes.unshift({id:nid++,to,txt,read:false})}
function go(p){page=p;render()}
function render(){
 const N=cur?notes.filter(n=>n.to==cur.id&&!n.read).length:0;
 const tabs=!cur?[['home','Trang chủ'],['market','Kho đồ dùng'],['about','Giới thiệu'],['contact','Liên hệ']]:cur.role=='student'?[['dash','Dashboard'],['market','Kho đồ dùng'],['post','Đăng đồ'],['my','Đồ của tôi'],['friends','Bạn bè'],['chat','Tin nhắn'],['needs','Nhu cầu của tôi'],['mine','Giao dịch'],['notes','Thông báo'+(N?' ('+N+')':'')],['rank','Green Impact']]:[[cur.role,'Thống kê'],['market','Bài đăng']];
 $('#nav').innerHTML=tabs.map(t=>`<button class="${page==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+(cur?`<span class="mu" style="padding:8px">👤 ${esc(cur.name.split(' ')[0])}</span>`:'');
 $('#auth').innerHTML=cur?`<button class="btn o" onclick="logout()">Đăng xuất</button>`:`<button class="btn" onclick="loginModal()">Đăng nhập</button>`;const v={home,market,dash,post,mine,notes:notesV,needs:needsV,login:loginV,prof:profV,user:userV,friends:friendsV,chat:chatV,register:registerV,forgot:forgotV,about:aboutV,terms:termsV,privacy:privacyV,contact:contactV,my:myV,rank,admin,super:admin}[page];$('#app').innerHTML=v();
 if(page=='market')['q','cat','st','sort'].forEach(k=>{const e=$('#f_'+k);if(e)e.value=f[k]})
}
function home(){return `<div class="hero"><span class="tag">Một món đồ nhàn rỗi – Một người cần được giúp đỡ</span><h1>Chia sẻ tri thức.<br>Kết nối cộng đồng.</h1><p class="mu">Mượn, cho mượn và tái sử dụng đồ dùng học tập trong trường bạn.</p>
<p><button class="btn" onclick="go('market')">Khám phá ngay</button></p>
<p class="mu">Thử vai khác: <a href="#" onclick="login('u2');return false">Học sinh 2</a> · <a href="#" onclick="login('a1');return false">School Admin</a> · <a href="#" onclick="login('s1');return false">Super Admin</a></p></div>
<div class="grid">${[['🔍 Smart Matching','Gợi ý theo từ khóa và danh mục'],['📱 QR Borrowing','Mã QR xác nhận giao dịch hai bên'],['🌱 Green Points','Tích điểm khi chia sẻ'],['🤝 Trusted Community','Mỗi trường một cộng đồng riêng']].map(x=>`<div class="card"><b>${x[0]}</b><p class="mu">${x[1]}</p></div>`).join('')}</div>`}
function market(){
 let L=items.filter(i=>(!f.q||i.name.toLowerCase().includes(f.q.toLowerCase()))&&(!f.cat||i.cat==f.cat)&&(!f.st||i.status==f.st)).sort((a,b)=>f.sort=='pop'?b.views-a.views:b.t-a.t);
 return `<div class="row"><h2>Kho đồ dùng</h2><button class="btn g" onclick="newItem()">+ Đăng đồ của bạn</button></div><div class="bar card"><input id="f_q" placeholder="Tìm theo tên…" oninput="f.q=this.value;rs()"><select id="f_cat" onchange="f.cat=this.value;rs()"><option value="">Mọi danh mục</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="f_st" onchange="f.st=this.value;rs()"><option value="">Mọi trạng thái</option><option>Available</option><option>Pending</option><option>Borrowed</option></select><select id="f_sort" onchange="f.sort=this.value;rs()"><option value="new">Mới nhất</option><option value="pop">Phổ biến</option></select></div><br>
 <div class="grid">${L.map(i=>`<div class="card"><img class="im" loading="lazy" alt="" src="${pic(i)}" onclick="detail('${i.id}')"><div class="row"><span class="tag">${i.cat}</span><span class="tag ${i.status}">${i.status}</span></div><h3>${esc(i.name)}</h3><p class="mu">${esc(i.desc)}<br>Chủ: ${USERS[i.owner]?.name||'Bạn'} · ${i.cond}<br>Nhận tại: ${esc(i.loc)}</p>
 <div class="row"><button class="btn o" onclick="fav('${i.id}')">${i.fav?'♥':'♡'}</button><button class="btn o" onclick="navigator.clipboard?.writeText(location.href+'#'+'${i.id}');toast('Đã sao chép liên kết')">Chia sẻ</button>${cur&&i.owner==cur.id?`<button class="btn r" onclick="del('${i.id}')">Xóa</button>`:`<button class="btn" ${i.status!='Available'?'disabled':''} onclick="reqForm('${i.id}')">Yêu cầu mượn</button>`}</div></div>`).join('')||'<p class="mu">Không có đồ dùng phù hợp.</p>'}</div>`}
function rs(){const p=$('#f_q').selectionStart;render();const e=$('#f_q');e.focus();e.setSelectionRange(p,p)}

function tok(){return Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('')}
function act(rid,a){const r=reqs.find(x=>x.id==rid),i=items.find(x=>x.id==r.item);
 if(a=='ok'&&cur.id==r.to){r.st='Approved';r.token=tok();notify(r.from,`Yêu cầu mượn "${i.name}" được chấp nhận.`)}
 else if(a=='no'&&cur.id==r.to){r.st='Rejected';i.status='Available';notify(r.from,`Yêu cầu mượn "${i.name}" bị từ chối.`)}
 else if(a=='cancel'&&cur.id==r.from&&r.st=='Pending'){r.st='Cancelled';i.status='Available'}
 else if(a=='scan'&&cur.id==r.from&&r.st=='Approved'){const t=prompt('Nhập/dán mã QR của giao dịch (hoặc quét bằng camera rồi dán mã):');
  if(t!==r.token)return toast('Mã QR không hợp lệ');r.got=true;toast('Bạn đã xác nhận nhận đồ. Chờ chủ đồ xác nhận đã giao.')}
 else if(a=='give'&&cur.id==r.to&&r.st=='Approved'){r.gave=true}
 else if(a=='retreq'&&cur.id==r.from&&r.st=='Active'){r.st='Return';notify(r.to,`${cur.name} đã trả "${i.name}", vui lòng xác nhận.`)}
 else if(a=='done'&&cur.id==r.to&&r.st=='Return'){r.st='Completed';r.token=null;i.status='Available';USERS[r.to].pts+=20;USERS[r.from].pts+=10;notify(r.from,'Giao dịch hoàn tất! +10 Green Points.')}
 if(r.st=='Approved'&&r.gave&&r.got){r.st='Active';i.status='Borrowed';r.token=null;notify(r.from,`Cả hai bên đã xác nhận bàn giao "${i.name}".`)}
 else if(r.st=='Approved')i.status='Pending';
 render()}

 return `<h2>Quản lý giao dịch</h2>${L.map(r=>{const i=items.find(x=>x.id==r.item)||{name:'(đã xóa)'},own=r.to==cur.id;

 ${own&&r.st=='Pending'?`<button class="btn g" onclick="act('${r.id}','ok')">Chấp nhận</button><button class="btn r" onclick="act('${r.id}','no')">Từ chối</button>`:''}
 ${!own&&r.st=='Pending'?`<button class="btn r" onclick="act('${r.id}','cancel')">Hủy yêu cầu</button>`:''}
 ${r.st=='Approved'?`<button class="btn o" onclick="showQR('${r.id}')">Xem QR</button>`+(own?`<button class="btn" ${r.gave?'disabled':''} onclick="act('${r.id}','give')">${r.gave?'Đã xác nhận giao':'Xác nhận đã giao'}</button>`:`<button class="btn" ${r.got?'disabled':''} onclick="act('${r.id}','scan')">${r.got?'Đã xác nhận nhận':'Nhập mã QR nhận đồ'}</button>`):''}

function resize(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}

 editId=null;pimgs=[];save();go('my')}

async function sha(s){if(!crypto.subtle)return 'p:'+s;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cs:'+s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}

async function doReg(){const n=$('#r_n').value.trim(),i=$('#r_i').value.trim().toLowerCase().split(' ').join(''),p=$('#r_p').value;if(n.length<2)return toast('Nhập họ tên');if(!(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i)||/^0\d{9}$/.test(i)))return toast('Email hoặc SĐT (10 số) không hợp lệ');if(p.length<6)return toast('Mật khẩu tối thiểu 6 ký tự');if(ACC.concat(reg).some(a=>a.ids.includes(i)))return toast('Tài khoản đã tồn tại');const id='u'+Date.now(),user={id,name:n,role:'student',school:$('#r_s').value.trim()||'—',cls:$('#r_c').value.trim()||'—',pts:0};reg.push({id,ids:[i],h:await sha(p),user});USERS[id]=user;try{localStorage.setItem('cs_accs',JSON.stringify(reg))}catch(e){}closeM();toast('Đăng ký thành công');login(id)}

function count(el){const t=+el.dataset.n;let s=0;const st=()=>{s+=Math.max(1,Math.ceil(t/30));el.textContent=Math.min(s,t);if(s<t)requestAnimationFrame(st)};st()}
function obs(){const io=window.IntersectionObserver?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll('[data-n]').forEach(count);io.unobserve(e.target)}}),{threshold:.15}):null;document.querySelectorAll('.rv').forEach(el=>{if(io)io.observe(el);else{el.classList.add('in');el.querySelectorAll('[data-n]').forEach(count)}})}

async function doLogin(){const i=$('#l_i').value.trim().toLowerCase().split(' ').join(''),p=$('#l_p').value;keep=!!$('#l_keep')?.checked;if(!i||!p)return toast('Nhập đầy đủ thông tin');const h=await sha(p);let uid=null;for(const a of ACC)if(a.ids.includes(i)&&(await sha(a.pw))==h)uid=a.id;for(const a of reg)if(a.ids.includes(i)&&a.h==h)uid=a.id;if(!uid)return toast('Sai tài khoản hoặc mật khẩu');closeM();login(uid)}

 done.forEach(r=>{const k=(r.d1||'').slice(0,7);if(k)M[k]=(M[k]||0)+1});const ks=Object.keys(M).sort().slice(-6),mx=Math.max(1,...ks.map(k=>M[k]));
 return `<h2>Green Impact</h2><p><i>"Mỗi lần chia sẻ là một lần giảm lãng phí."</i></p><div class="grid">${[['Đồ dùng được chia sẻ',items.length],['Giao dịch hoàn tất',done.length],['Đồ được tặng',gifts],['Học sinh tham gia',U.length]].map(x=>`<div class="card"><div class="mu">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><h3>Giao dịch hoàn tất theo tháng</h3><div class="card">${ks.length?`<div style="display:flex;align-items:flex-end;gap:12px;height:160px">${ks.map(k=>`<div style="flex:1;text-align:center"><div style="background:var(--p);border-radius:8px 8px 0 0;height:${Math.round(M[k]/mx*100)}px"></div><small class="mu">${k.slice(5)}/${k.slice(2,4)} · ${M[k]}</small></div>`).join('')}</div>`:'<p class="mu">Chưa có giao dịch hoàn tất nào.</p>'}</div><h3>Bảng xếp hạng Green Points</h3>${U.map((u,i)=>`<div class="card row" style="margin-bottom:8px"><a class="row" style="gap:10px;cursor:pointer" onclick="openUser('${u.id}')"><span>#${i+1}</span>${av(u,32)}<span>${esc(u.name)}</span></a><b>${u.pts||0} điểm</b></div>`).join('')||'<p class="mu">Chưa có học sinh nào.</p>'}`}
